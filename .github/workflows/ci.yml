name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4

      - name: Install protoc and xvfb
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler xvfb

      - run: npx nx format:check
      - run: npx nx run-many -t build
      - run: npx nx run-many -t lint
      - run: npx nx run-many -t test --coverage

      - name: E2E against example-robot (NT server)
        env:
          E2E_HEADLESS: 1
        run: npx nx run example-client:e2e:local

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
